<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Genos">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Snake</title>
    </head>
    
    <body>
        <div class="app">
            <div class="container">
                <div class="score-board">
                    <div>
                        <span>
                            <span>Max Score: </span>
                            <span id="max-score">0</span>
                        </span>
                    </div>
                    <div>
                        <span>Score: </span>
                        <span id="score">
                            <!-- score -->
                        </span>
                    </div>
                    <div>
                        <button class="icon-holder" id="settings-button">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                </div>
            </div>
            
            <div id="settings" class="settings">
                <h1>Settings</h1>
                <div class="settings-list">
                    <div class="settings-row">
                        <span>Reset Max Score</span>
                        <button id="reset-max-score">Reset</button>
                    </div>
                </div>
            </div>
            
            <div id="display-container" class="display-container">
                <!-- Splash screen -->
                
                <!-- Game Over Screen -->
                
                <!-- Pixel grid-->
            </div>
            
            <div class="button-board">
                <button class="icon-holder" id="play" class="button">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="icon-holder" id="pause" class="button" style="display: none;">
                    <i class="fa-solid fa-pause"></i>
                </button>
                <button class="icon-holder" id="reset" class="button" style="display: none;">
                    <i class="fa-solid fa-stop"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/5e41dcec9e.js" crossorigin="anonymous"></script>
    <script src="snake.js"></script>
</body>

</html>
