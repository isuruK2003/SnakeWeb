<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Genos">
        <title>Snake</title>
    </head>
    
    <body>
        <div class="app">
            <div class="container">
                <div class="score-board">
                    <div>
                        <span>
                            <span>Max Score: </span>
                            <span id="max-score">0</span>
                        </span>
                    </div>
                    <div>
                        <span>Score: </span>
                        <span id="score">
                            <!-- score -->
                        </span>
                    </div>
                    <div>
                        <button id="settings-button">
                            <span>&#9881;</span>
                        </button>
                </div>
            </div>
            
            <div id="settings" class="settings">
                <h1>Settings</h1>
                <div class="settings-list">
                    <div class="settings-row">
                        <span>Reset Max Score</span>
                        <button id="reset-max-score">Reset</button>
                    </div>
                </div>
            </div>
            
            <div id="display-container" class="display-container">
                <!-- Splash screen -->
                
                <!-- Game Over Screen -->
                
                <!-- Pixel grid-->
            </div>
            
            <div class="button-board">
                <button id="play" class="button">
                    <span>&#11208;</span>
                </button>
                <button id="pause" class="button" style="display: none;">
                    <span>&#x23F8;</span>
                </button>
                <button id="reset" class="button" style="display: none;">
                    <span>&#x23F9;</span>
                </button>
            </div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/5e41dcec9e.js" crossorigin="anonymous"></script>
    <script src="snake.js"></script>
</body>

</html>
